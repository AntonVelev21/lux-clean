name: lux_clean_dev

services:
  postgres:
    image: postgres:18-alpine
    env_file:
      - .env.ci
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 3s
      timeout: 5s
      retries: 20


  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.ci
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: